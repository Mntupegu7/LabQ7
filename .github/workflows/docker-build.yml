name: Dcoker Build CI
on:
  psuh:
    branches:
      - main
jobs:
  docker-build:
    runs-on: ubuntu latest
    steps:
      - name: Checkout Repository
        uses: actions/checkouts@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker Build Image
        run: |
          docker build -t docker-ci:v1 .